name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, type check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          AUTH_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXT_PUBLIC_APP_URL: http://localhost:3000
  # The e2e suite needs a real Postgres database. It runs only once the
  # E2E_DATABASE_URL and E2E_DIRECT_DATABASE_URL repository secrets are set,
  # and is skipped (not failed) otherwise.
  e2e-config:
    name: Check e2e database
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: echo "enabled=${{ env.E2E_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests
    needs: e2e-config
    if: needs.e2e-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.E2E_DIRECT_DATABASE_URL }}
      AUTH_SECRET: test-secret-test-secret-test-secret-test
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      AUTH_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
      E2E_TEST_MODE: "true"
      PORT: "3001"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.E2E_DIRECT_DATABASE_URL }}
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
